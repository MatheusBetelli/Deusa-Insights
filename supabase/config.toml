# Supabase CLI Project Configuration (Deusa Insights)
# Este arquivo prepara o projeto para eventual uso do Supabase CLI local / gerenciado.

project_id = "deusa-insights"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:3001"]

[analytics]
enabled = false
