name: CI - Integracao Continua (Deusa Analytics)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências do Monorepo
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Executar Typecheck do Monorepo
        run: npm run typecheck

      - name: Compilar Backend e Frontend
        env:
          # URL não roteável usada somente para validar o bundle; deploys reais devem fornecer sua API HTTPS.
          VITE_API_URL: https://api.deusa-ci.invalid
        run: npm run build

      - name: Executar Testes Unitários
        run: npm run test
