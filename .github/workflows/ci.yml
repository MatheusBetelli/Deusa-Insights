name: CI - Integracao Continua (Deusa Analytics)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  migration-check:
    name: PostgreSQL Migration Chain
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deusa_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deusa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deusa_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/deusa_ci?schema=public

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node.js (v22.13.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        run: cd backend && npm ci

      - name: Validar cadeia completa de migrations
        run: |
          cd backend
          npx prisma generate
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma migrate diff --exit-code --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma

  build-and-test:
    name: Lint, Typecheck, Audit, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detectar segredos no histórico Git
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js (v22.13.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências do Monorepo
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Gerar Prisma Client
        run: cd backend && npx prisma generate

      - name: Validar higiene do repositório
        run: npm run hygiene

      - name: Executar Lint do Monorepo
        run: npm run lint

      - name: Detectar codigo e dependencias sem uso
        run: npm run deadcode

      - name: Executar Typecheck do Monorepo
        run: npm run typecheck

      - name: Validar higiene do diff
        run: git diff --check

      - name: Auditar Dependencias de Producao
        run: npm run audit --omit=dev

      - name: Executar Testes Unitarios
        run: npm run test

      - name: Compilar Backend e Frontend
        env:
          # URL não roteável usada somente para validar o bundle; deploys reais devem fornecer sua API HTTPS.
          VITE_API_URL: https://api.deusa-ci.invalid
        run: npm run build

      - name: Construir imagem de produção do backend
        run: docker build --tag deusa-insights-backend:ci --file backend/Dockerfile backend

      - name: Validar empacotamento do Cloudflare Worker
        env:
          CI: 1
          VITE_API_URL: https://api.deusa-ci.invalid
          WRANGLER_WRITE_LOGS: false
        run: npm --prefix frontend run deploy:dry-run
