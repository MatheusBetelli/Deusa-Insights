name: Deploy Production Canary

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA validado da main que será publicado"
        required: true
        type: string
      backend_canary_url:
        description: "URL HTTPS do backend canary para smoke (opcional)"
        required: false
        type: string
      frontend_canary_url:
        description: "URL HTTPS do frontend canary para smoke (opcional)"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: production-canary
  cancel-in-progress: false

jobs:
  deploy-canary:
    name: Build, Push & Deploy Full Stack without Traffic
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      BACKEND_SERVICE: ${{ vars.CLOUD_RUN_BACKEND_SERVICE }}
      FRONTEND_SERVICE: ${{ vars.CLOUD_RUN_FRONTEND_SERVICE }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      RELEASE_INPUT: ${{ inputs.release_sha }}

    steps:
      - name: Checkout da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validar configuração e release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          for variable in PROJECT_ID REGION ARTIFACT_REPOSITORY BACKEND_SERVICE FRONTEND_SERVICE WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT; do
            if [[ -z "${!variable}" ]]; then
              echo "GitHub variable ausente: ${variable}" >&2
              exit 1
            fi
          done

          RELEASE_SHA="$(git rev-parse "${RELEASE_INPUT}^{commit}")"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          git checkout --detach "${RELEASE_SHA}"
          echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "backend_image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/backend:${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "frontend_image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/frontend:${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Confirmar CI verde para o SHA selecionado
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100" |
            node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const data = JSON.parse(input);
                const passed = (data.workflow_runs || []).some((run) =>
                  run.name === "CI - Integracao Continua (Deusa Analytics)" &&
                  run.event === "push" &&
                  run.head_sha === process.env.RELEASE_SHA &&
                  run.status === "completed" &&
                  run.conclusion === "success"
                );
                if (!passed) {
                  console.error(`Nenhum CI push verde encontrado para ${process.env.RELEASE_SHA}.`);
                  process.exit(1);
                }
                console.log(`CI push verde confirmado para ${process.env.RELEASE_SHA}.`);
              });
            '

      - name: Autenticar no Google Cloud sem chave persistente
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Confirmar serviços previamente provisionados
        run: |
          set -euo pipefail
          gcloud run services describe "${BACKEND_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(metadata.name)'
          gcloud run services describe "${FRONTEND_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(metadata.name)'

      - name: Construir e publicar imagens imutáveis
        env:
          BACKEND_IMAGE: ${{ steps.release.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.release.outputs.frontend_image }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --file backend/Dockerfile --tag "${BACKEND_IMAGE}" backend/
          docker build --file frontend/Dockerfile --tag "${FRONTEND_IMAGE}" frontend/
          docker push "${BACKEND_IMAGE}"
          docker push "${FRONTEND_IMAGE}"

      - name: Registrar digests publicados
        env:
          BACKEND_IMAGE: ${{ steps.release.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.release.outputs.frontend_image }}
        run: |
          set -euo pipefail
          echo "Backend digest: $(gcloud artifacts docker images describe "${BACKEND_IMAGE}" --project="${PROJECT_ID}" --format='value(image_summary.digest)')" >> "${GITHUB_STEP_SUMMARY}"
          echo "Frontend digest: $(gcloud artifacts docker images describe "${FRONTEND_IMAGE}" --project="${PROJECT_ID}" --format='value(image_summary.digest)')" >> "${GITHUB_STEP_SUMMARY}"

      - name: Criar revisão backend canary sem tráfego
        env:
          BACKEND_IMAGE: ${{ steps.release.outputs.backend_image }}
        run: |
          gcloud run deploy "${BACKEND_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${BACKEND_IMAGE}" \
            --no-traffic \
            --tag=canary \
            --quiet

      - name: Criar revisão frontend canary sem tráfego
        env:
          FRONTEND_IMAGE: ${{ steps.release.outputs.frontend_image }}
        run: |
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${FRONTEND_IMAGE}" \
            --no-traffic \
            --tag=canary \
            --quiet

      - name: Smoke de saúde do backend canary
        if: ${{ inputs.backend_canary_url != '' }}
        env:
          CANARY_URL: ${{ inputs.backend_canary_url }}
        run: |
          set -euo pipefail
          for path in /health/live /health/ready; do
            curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              "${CANARY_URL%/}${path}" >/dev/null
            echo "Smoke passou: ${path}"
          done

      - name: Smoke de saúde do frontend canary
        if: ${{ inputs.frontend_canary_url != '' }}
        env:
          CANARY_URL: ${{ inputs.frontend_canary_url }}
        run: |
          set -euo pipefail
          for path in /login /api/health/ready; do
            curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              "${CANARY_URL%/}${path}" >/dev/null
            echo "Smoke passou: ${path}"
          done

      - name: Registrar entrega
        env:
          BACKEND_IMAGE: ${{ steps.release.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.release.outputs.frontend_image }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          {
            echo "### Canário full-stack criado"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Backend: \`${BACKEND_IMAGE}\`"
            echo "- Frontend: \`${FRONTEND_IMAGE}\`"
            echo "- Tráfego: 0% em ambos os serviços"
            echo "- Próximo gate: E2E, observabilidade e promoção gradual conforme DEPLOY.md"
          } >> "${GITHUB_STEP_SUMMARY}"
